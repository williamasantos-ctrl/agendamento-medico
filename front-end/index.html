<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedFlash - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="login-box">

            <div class="logo">
                <img src="./imagens/Logo.png" alt="Logo MedFlash">
            </div>

            <form id="loginForm">

                <label for="login">Login</label>

                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Digite seu login">

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha">

                <p id="mensagemErro"></p>

                <div class="botoes">

                    <div class="botoes">

    <button type="submit" class="btn-confirmar">
        Confirmar
    </button>

    <button
        type="button"
        class="btn-secundario"
        onclick="window.location.href='esqueci_senha.html'">
        Esqueci a Senha
    </button>

</div>

<button
    type="button"
    class="btn-cadastro"
    onclick="window.location.href='cadastro.html'">

    Cadastro

</button>

            </form>

        </section>

    </main>

    <script src="./login.js"></script>

</body>

</html>
